[project]
name = "karyakarta-backend"
version = "0.1.0"
description = "Local-first browser agent backend: model runtime, agent loop, policy firewall, storage and API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "playwright>=1.48",
    "pydantic>=2.8",
    "platformdirs>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: runs against the real local model and a real browser (slow, opt-in with -m live)",
]
addopts = "-m 'not live' --timeout=120"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["karyakarta"]
